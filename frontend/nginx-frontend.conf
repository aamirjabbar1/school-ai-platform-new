server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # React Router support
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html is the only file that names the current hashed bundles, so it
    # must never be served from cache. It was previously sent with no
    # Cache-Control at all, which lets a browser cache it heuristically: users
    # kept loading the previous deployment's JavaScript after a refresh, and a
    # shipped fix could sit on the server without reaching anyone. Everything
    # else is content-hashed and safe to keep forever.
    location = /index.html {
        expires -1;
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;
}
