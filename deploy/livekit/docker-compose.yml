# ─── LSS Online Classroom — media server ─────────────────────────────────────
#
# Runs on its OWN host (Hetzner CCX23, live.lssbot.net) — not on the
# application VPS. Two reasons: real-time media must not compete with Milvus and
# PostgreSQL for CPU, and TURN needs port 443, which nginx already holds on the
# application host. Students behind mobile CGNAT frequently cannot connect
# without TURN on 443, so this is a connectivity requirement, not a preference.
#
# Host networking is required: WebRTC needs a wide, individually addressable UDP
# port range, which Docker's per-port mapping cannot provide efficiently.
#
# Recording (livekit-egress) is deliberately absent — it arrives in Phase 3.

services:

  livekit:
    image: livekit/livekit-server:latest
    container_name: lss_livekit
    restart: unless-stopped
    command: --config /etc/livekit.yaml
    network_mode: host
    volumes:
      - ./livekit.yaml:/etc/livekit.yaml:ro
    environment:
      # Key/secret pair shared with the LSS backend. Keep them in this host's
      # .env file; they are never published to a browser.
      LIVEKIT_KEYS: "${LIVEKIT_API_KEY}: ${LIVEKIT_API_SECRET}"

  caddy:
    image: livekit/caddyl4:latest
    container_name: lss_livekit_caddy
    restart: unless-stopped
    network_mode: host
    volumes:
      - ./caddy.yaml:/etc/caddy.yaml:ro
      - caddy_data:/data
    command: run --config /etc/caddy.yaml --adapter yaml

  redis:
    image: redis:8-alpine
    container_name: lss_livekit_redis
    restart: unless-stopped
    command: redis-server --bind 127.0.0.1 --maxmemory 128mb --maxmemory-policy allkeys-lru
    network_mode: host

  # ─── Recorder (Egress) ───────────────────────────────────────────────────────
  #
  # Records a class as a student saw it and uploads the MP4 straight to the
  # school's object storage. Each concurrent recording runs a headless browser
  # and costs roughly a CPU core, which is why the backend caps how many
  # classes may record at once (Admin → Live Classes → Settings).
  #
  # It records; it does not transcribe. No speech service is involved, and the
  # finished file is never sent to an AI provider.
  #
  # Storage destination is configured on the APPLICATION VPS via RECORDING_S3_*
  # — the recorder receives it per job, so nothing sensitive lives here.
  egress:
    image: livekit/egress:latest
    container_name: lss_livekit_egress
    restart: unless-stopped
    environment:
      EGRESS_CONFIG_BODY: |
        redis:
          address: 127.0.0.1:6379
        api_key: ${LIVEKIT_API_KEY}
        api_secret: ${LIVEKIT_API_SECRET}
        ws_url: ws://127.0.0.1:7880
        insecure: true
        log_level: info
    # Chrome needs SYS_ADMIN for its sandbox; host networking keeps it on the
    # same Redis and signalling socket as the SFU.
    cap_add:
      - SYS_ADMIN
    shm_size: 1gb
    network_mode: host
    depends_on:
      - redis
      - livekit

volumes:
  caddy_data:
